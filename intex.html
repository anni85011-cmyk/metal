<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профессиональная металлообработка | Изготовление деталей на заказ в Нижнем Новгороде</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Exo+2:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* ШАПКА */
        header {
            background: linear-gradient(rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.92)), url('https://images.unsplash.com/photo-1581094794329-c8112a89af12?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 100px 0 80px;
            text-align: center;
        }
        
        .logo {
            font-family: 'Exo 2', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2a75ff;
        }
        
        .tagline {
            font-size: 1.4rem;
            margin-bottom: 40px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            color: #ddd;
        }
        
        .contact-header {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 30px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        
        .contact-item i {
            color: #2a75ff;
            font-size: 1.3rem;
        }
        
        /* КНОПКИ */
        .btn {
            display: inline-block;
            background-color: #2a75ff;
            color: white;
            padding: 14px 32px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
        
        .btn:hover {
            background-color: #1c65e8;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-whatsapp {
            background-color: #25D366;
        }
        
        .btn-whatsapp:hover {
            background-color: #1da851;
        }
        
        /* РАЗДЕЛЫ */
        section {
            padding: 80px 0;
        }
        
        .section-title {
            text-align: center;
            font-family: 'Exo 2', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #222;
        }
        
        .section-subtitle {
            text-align: center;
            color: #666;
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 50px;
        }
        
        /* УСЛУГИ */
        .services {
            background-color: white;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }
        
        .service-card {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            border-left: 4px solid #2a75ff;
        }
        </div>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 40px; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                <h3>Как добавить свои фотографии:</h3>
                <p>1. Нажмите "Add file" → "Upload files"<br>
                   2. Загрузите фотографии в папку images/<br>
                   3. Замените photo-placeholder на &lt;img src="images/ваше-фото.jpg"&gt;</p>
            </div>
        </div>
    </section>

    <!-- КОНТАКТЫ -->
    <section id="contact" class="contact">
        <div class="container">
            <h2 class="section-title">Контакты и заявки</h2>
            <p class="section-subtitle">Отправьте чертёж для расчёта стоимости. Ответим в течение 1 часа.</p>
            
            <div class="contact-info">
                <div class="contact-card">
                    <i class="fas fa-phone"></i>
                    <h3>Телефон / WhatsApp</h3>
                    <p>+7 (904) 957-30-33</p>
                    <p>Ежедневно 8:00-20:00</p>
                </div>
                
                <div class="contact-card">
                    <i class="fas fa-envelope"></i>
                    <h3>Email для чертежей</h3>
                    <p>anna_karmanov_a@mail.ru</p>
                    <p>Форматы: PDF, JPG, DWG, STEP</p>
                </div>
                
                <div class="contact-card">
                    <i class="fas fa-clock"></i>
                    <h3>Сроки изготовления</h3>
                    <p>От 1 дня</p>
                    <p>Зависит от сложности</p>
                </div>
            </div>
            
            <div class="contact-form">
                <h3 style="margin-bottom: 20px;">Быстрая заявка</h3>
                <div class="form-group">
                    <input type="text" placeholder="Ваше имя" id="name">
                </div>
                <div class="form-group">
                    <input type="tel" placeholder="Телефон" id="phone">
                </div>
                <div class="form-group">
                    <textarea placeholder="Описание детали, материал, количество или прикрепите ссылку на чертёж" id="message"></textarea>
                </div>
                <button class="btn" onclick="sendRequest()">Отправить заявку</button>
            </div>
            
            <div style="margin-top: 40px;">
                <a href="https://wa.me/79049573033?text=Здравствуйте!%20Нужен%20расчёт%20детали.%20Присылаю%20чертёж." class="btn btn-whatsapp" style="margin-right: 10px;">
                    <i class="fab fa-whatsapp"></i> Написать в WhatsApp
                </a>
                <a href="tel:+79049573033" class="btn">
                    <i class="fas fa-phone"></i> Позвонить
                </a>
            </div>
        </div>
    </section>

    <!-- ФУТЕР -->
    <footer>
        <div class="container">
            <h3 style="color: white; margin-bottom: 20px;">МеталлМастер НН</h3>
            <p>Профессиональная металлообработка в Нижнем Новгороде</p>
            
            <div class="footer-links">
                <a href="#services">Услуги</a>
                <a href="#machines">Оборудование</a>
                <a href="#photos">Фото работ</a>
                <a href="#contact">Контакты</a>
            </div>
            
            <p style="margin-top: 30px; font-size: 0.9rem;">
                <a href="tel:+79049573033" style="color: #2a75ff; text-decoration: none; margin-right: 20px;">
                    <i class="fas fa-phone"></i> +7 (904) 957-30-33
                </a>
                <a href="mailto:anna_karmanov_a@mail.ru" style="color: #2a75ff; text-decoration: none;">
                    <i class="fas fa-envelope"></i> anna_karmanov_a@mail.ru
                </a>
            </p>
            
            <p style="margin-top: 20px; color: #777; font-size: 0.8rem;">
                © 2025 МеталлМастер НН. Изготовление деталей на заказ.
            </p>
        </div>
    </footer>

    <script>
        // Плавная прокрутка
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;
                const targetElement = document.querySelector(targetId);
                if(targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });
        
        // Обработка формы заявки
        function sendRequest() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            
            if(!phone) {
                alert('Пожалуйста, укажите телефон для связи');
                return;
            }
            
            // Формируем сообщение для WhatsApp
            const whatsappMessage = Новая заявка с сайта:%0AИмя: ${name || 'не указано'}%0AТелефон: ${phone}%0AСообщение: ${message || 'не указано'};
            
            // Открываем WhatsApp с предзаполненным сообщением
            window.open(`https://wa.me/79049573033?text=${whatsappMessage}`, '_blank');
            
            // Очищаем форму
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('message').value = '';
            
            alert('Заявка отправлена! Открывается WhatsApp для подтверждения.');
        }
        
        // Автоматический год в футере
        document.addEventListener('DOMContentLoaded', function() {
            const yearElement = document.querySelector('footer p:last-child');
            if(yearElement) {
                yearElement.innerHTML = yearElement.innerHTML.replace('2025', new Date().getFullYear());
            }
        });
    </script>
</body>
</html>
